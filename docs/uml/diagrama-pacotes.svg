<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 620" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .pkg-box { fill: #ffffff; stroke: #334155; stroke-width: 2; rx: 6; }
      .pkg-tab { fill: #e2e8f0; stroke: #334155; stroke-width: 1.5; font-family: 'Segoe UI', Arial, sans-serif; font-size: 13px; font-weight: bold; fill-opacity: 0.9; }
      .cls-box { fill: #f1f5f9; stroke: #475569; stroke-width: 1.5; rx: 4; }
      .cls-interface { fill: #eff6ff; stroke: #2563eb; stroke-width: 2; rx: 4; }
      .cls-title { font-family: 'Segoe UI', Arial, sans-serif; font-size: 14px; font-weight: 600; text-anchor: middle; fill: #0f172a; }
      .cls-stereo { font-family: 'Segoe UI', Arial, sans-serif; font-size: 11px; font-style: italic; text-anchor: middle; fill: #2563eb; }
      .arrow { stroke: #334155; stroke-width: 1.8; fill: none; }
      .arrow-dashed { stroke: #475569; stroke-width: 1.8; stroke-dasharray: 5,5; fill: none; }
      .arrow-dip { stroke: #dc2626; stroke-width: 2.2; fill: none; }
      .label { font-family: 'Segoe UI', Arial, sans-serif; font-size: 12px; fill: #1e293b; }
      .label-dip { font-family: 'Segoe UI', Arial, sans-serif; font-size: 12px; font-weight: bold; fill: #dc2626; }
      .note-box { fill: #fef3c7; stroke: #d97706; stroke-width: 1.5; rx: 4; }
      .note-text { font-family: 'Segoe UI', Arial, sans-serif; font-size: 11px; fill: #92400e; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#334155" />
    </marker>
    <marker id="arrowhead-dash" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#475569" />
    </marker>
    <marker id="arrowhead-dip" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#dc2626" />
    </marker>
    <marker id="hollow-arrow" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto">
      <polygon points="0 0, 10 5, 0 10" fill="#ffffff" stroke="#334155" stroke-width="1.5" />
    </marker>
  </defs>

  <rect width="950" height="620" class="bg" />

  <!-- TITLE -->
  <text x="475" y="30" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="18" font-weight="bold" fill="#0f172a">
    Diagrama de Pacotes e Inversão de Dependência (DIP) - Missão Marte
  </text>

  <!-- PACKAGE solidexercicio10 (Main) -->
  <g id="pkg-main">
    <rect x="50" y="55" width="130" height="24" class="pkg-tab" />
    <text x="60" y="72" fill="#334155" font-family="'Segoe UI', Arial, sans-serif" font-size="12" font-weight="bold">solidexercicio10</text>
    <rect x="50" y="79" width="180" height="110" class="pkg-box" />
    <rect x="75" y="105" width="130" height="45" class="cls-box" />
    <text x="140" y="132" class="cls-title">Main</text>
  </g>

  <!-- PACKAGE solidexercicio10.service -->
  <g id="pkg-service">
    <rect x="360" y="55" width="180" height="24" class="pkg-tab" />
    <text x="370" y="72" fill="#334155" font-family="'Segoe UI', Arial, sans-serif" font-size="12" font-weight="bold">solidexercicio10.service</text>
    <rect x="360" y="79" width="220" height="110" class="pkg-box" />
    <rect x="395" y="105" width="150" height="45" class="cls-box" />
    <text x="470" y="132" class="cls-title">JogoService</text>
  </g>

  <!-- PACKAGE solidexercicio10.presentation -->
  <g id="pkg-presentation">
    <rect x="680" y="55" width="210" height="24" class="pkg-tab" />
    <text x="690" y="72" fill="#334155" font-family="'Segoe UI', Arial, sans-serif" font-size="12" font-weight="bold">solidexercicio10.presentation</text>
    <rect x="680" y="79" width="220" height="110" class="pkg-box" />
    <rect x="715" y="105" width="150" height="45" class="cls-box" />
    <text x="790" y="132" class="cls-title">MapaRenderer</text>
  </g>

  <!-- PACKAGE solidexercicio10.repository -->
  <g id="pkg-repository">
    <rect x="50" y="270" width="210" height="24" class="pkg-tab" />
    <text x="60" y="287" fill="#334155" font-family="'Segoe UI', Arial, sans-serif" font-size="12" font-weight="bold">solidexercicio10.repository</text>
    <rect x="50" y="294" width="440" height="240" class="pkg-box" />
    
    <!-- RankingRepository Interface -->
    <rect x="80" y="325" width="180" height="60" class="cls-interface" />
    <text x="170" y="348" class="cls-stereo">&lt;&lt;interface&gt;&gt;</text>
    <text x="170" y="368" class="cls-title" fill="#1d4ed8">RankingRepository</text>

    <!-- RankingService Class -->
    <rect x="80" y="440" width="180" height="50" class="cls-box" />
    <text x="170" y="470" class="cls-title">RankingService</text>

    <!-- RankingEntry Class -->
    <rect x="300" y="380" width="160" height="50" class="cls-box" />
    <text x="380" y="410" class="cls-title">RankingEntry</text>
  </g>

  <!-- PACKAGE solidexercicio10.model -->
  <g id="pkg-model">
    <rect x="570" y="270" width="190" height="24" class="pkg-tab" />
    <text x="580" y="287" fill="#334155" font-family="'Segoe UI', Arial, sans-serif" font-size="12" font-weight="bold">solidexercicio10.model</text>
    <rect x="570" y="294" width="330" height="240" class="pkg-box" />
    
    <rect x="595" y="325" width="120" height="40" class="cls-box" />
    <text x="655" y="350" class="cls-title">Missao</text>

    <rect x="750" y="325" width="120" height="40" class="cls-box" />
    <text x="810" y="350" class="cls-title">Nave</text>

    <rect x="595" y="385" width="120" height="40" class="cls-box" />
    <text x="655" y="410" class="cls-title">Passageiro</text>

    <rect x="750" y="385" width="120" height="40" class="cls-box" />
    <text x="810" y="410" class="cls-title">EntidadeMapa</text>

    <rect x="670" y="455" width="140" height="40" class="cls-box" />
    <text x="740" y="480" class="cls-title">&lt;&lt;enum&gt;&gt; Dificuldade</text>
  </g>

  <!-- DEPENDENCY ARROWS -->
  <!-- Main -> JogoService -->
  <line x1="205" y1="127" x2="395" y2="127" class="arrow-dashed" marker-end="url(#arrowhead-dash)" />
  <text x="290" y="118" class="label" text-anchor="middle">instancia</text>

  <!-- JogoService -> MapaRenderer -->
  <line x1="545" y1="127" x2="715" y2="127" class="arrow" marker-end="url(#arrowhead)" />
  <text x="630" y="118" class="label" text-anchor="middle">delega desenho</text>

  <!-- Main -> RankingService (Composition Root) -->
  <path d="M 120 150 L 120 440" class="arrow-dashed" marker-end="url(#arrowhead-dash)" />
  <text x="125" y="235" class="label">Composition Root (instancia)</text>

  <!-- Main -> RankingRepository (injeta) -->
  <path d="M 160 150 L 160 325" class="arrow-dashed" marker-end="url(#arrowhead-dash)" />
  <text x="165" y="215" class="label">injeta</text>

  <!-- JogoService -> RankingRepository (DIP Arrow) -->
  <path d="M 430 150 L 430 250 L 220 250 L 220 325" class="arrow-dip" marker-end="url(#arrowhead-dip)" />
  <text x="325" y="242" class="label-dip" text-anchor="middle">DIP: depende da abstração RankingRepository</text>

  <!-- RankingService implements RankingRepository -->
  <line x1="170" y1="440" x2="170" y2="385" class="arrow-dashed" marker-end="url(#hollow-arrow)" />
  <text x="175" y="415" class="label">implementa</text>

  <!-- RankingService -> RankingEntry -->
  <line x1="260" y1="445" x2="300" y2="425" class="arrow-dashed" marker-end="url(#arrowhead-dash)" />
  <text x="290" y="455" class="label">cria</text>

  <!-- JogoService -> Missao -->
  <path d="M 480 150 L 480 345 L 595 345" class="arrow" marker-end="url(#arrowhead)" />
  <text x="540" y="338" class="label" text-anchor="middle">orquestra</text>

  <!-- MapaRenderer -> Missao -->
  <path d="M 780 150 L 780 250 L 655 250 L 655 325" class="arrow-dashed" marker-end="url(#arrowhead-dash)" />
  <text x="720" y="242" class="label" text-anchor="middle">consulta estado</text>

  <!-- RankingRepository -> Dificuldade -->
  <path d="M 260 365 L 520 365 L 520 475 L 670 475" class="arrow-dashed" marker-end="url(#arrowhead-dash)" />
  <text x="530" y="435" class="label">usa</text>

  <!-- NOTE DIP -->
  <g id="note-dip">
    <rect x="50" y="550" width="850" height="50" class="note-box" />
    <text x="65" y="570" class="note-text" font-weight="bold">★ Princípio da Inversão de Dependência (DIP):</text>
    <text x="65" y="588" class="note-text">
      O serviço de regras de negócio (JogoService) depende exclusivamente da abstração RankingRepository (interface). A persistência concreta (RankingService) fica desacoplada na borda do sistema.
    </text>
  </g>
</svg>
